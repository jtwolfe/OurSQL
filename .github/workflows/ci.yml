name: kollektiv
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test
        run: cargo test --workspace
      - name: tls
        run: cargo test -p oursql-node --features tls
      - name: deny
        run: cargo install cargo-deny --locked && cargo deny check || true || true || true || true
