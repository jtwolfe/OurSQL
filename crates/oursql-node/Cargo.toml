[package]
name = "oursql-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "oursqld — mesh node / TCP NashCQL server"
repository.workspace = true

[[bin]]
name = "oursqld"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
oursql-core.workspace = true
oursql-engine.workspace = true
oursql-wire.workspace = true
oursql-crypto.workspace = true
oursql-consensus.workspace = true
oursql-storage.workspace = true
serde_json.workspace = true

[dev-dependencies]
oursql-driver.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"

[features]
default = []
tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies.rustls]
version = "0.23"
optional = true
default-features = false
features = ["std", "ring"]

[dependencies.rustls-pemfile]
version = "2"
optional = true
