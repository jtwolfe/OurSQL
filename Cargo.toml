[workspace]
resolver = "2"
members = [
  "crates/oursql-core",
  "crates/oursql-nashcql",
  "crates/oursql-bureau",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jtwolfe/OurSQL"
homepage = "https://github.com/jtwolfe/OurSQL"
description = "OurSQL (NashCQL) — users keep the means of data hosting"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
oursql-core = { path = "crates/oursql-core" }
oursql-nashcql = { path = "crates/oursql-nashcql" }
oursql-bureau = { path = "crates/oursql-bureau" }
